<nav
  class="page-container flex h-16 items-center justify-between"
  aria-label="Main"
>
  <a
    routerLink="/"
    (click)="closeMenu()"
    class="flex items-center gap-2 text-lg font-bold tracking-tight transition-colors hover:text-accent"
  >
    <span
      class="grid size-8 place-items-center rounded-lg bg-linear-to-br from-accent to-accent-2 font-serif text-base text-accent-ink"
      aria-hidden="true"
      >∂</span
    >
    {{ name }}
  </a>

  <div class="flex items-center gap-1">
    <ul class="hidden items-center gap-1 sm:flex">
      @for (item of navItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="text-ink! bg-surface-2"
            class="rounded-full px-4 py-2 text-sm font-medium text-muted transition-colors hover:text-ink"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>

    <!-- Both icons are rendered; CSS picks one so SSR and the client always agree. -->
    <button
      appButton
      variant="ghost"
      square
      type="button"
      aria-label="Toggle dark mode"
      (click)="theme.toggle()"
    >
      <app-icon name="moon" [size]="18" class="dark:hidden" />
      <app-icon name="sun" [size]="18" class="hidden dark:inline-flex" />
    </button>

    <button
      appButton
      variant="ghost"
      square
      type="button"
      class="sm:hidden"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle menu"
      (click)="toggleMenu()"
    >
      <app-icon [name]="menuOpen() ? 'x' : 'menu'" [size]="18" />
    </button>
  </div>
</nav>

@if (menuOpen()) {
  <ul
    id="mobile-menu"
    class="page-container flex flex-col gap-1 border-t border-line pb-4 pt-2 sm:hidden"
  >
    @for (item of navItems; track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="text-ink! bg-surface-2"
          (click)="closeMenu()"
          class="block rounded-lg px-3 py-2 font-medium text-muted hover:text-ink"
          >{{ item.label }}</a
        >
      </li>
    }
  </ul>
}
